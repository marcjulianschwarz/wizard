services:
  backend:
    build:
      context: ./services/backend
      args:
        FRONTEND_URL: ${FRONTEND_URL}
    environment:
      - FRONTEND_URL=${FRONTEND_URL}
      - NODE_ENV=${NODE_ENV}
    expose:
      - "3000"
    networks:
      - wizard-network

  frontend:
    build:
      context: ./services/frontend-vite
      args:
        VITE_BACKEND_URL: ${BACKEND_URL}
    environment:
      - VITE_BACKEND_URL=${BACKEND_URL}
      - NODE_ENV=${NODE_ENV}
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - wizard-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - wizard-network
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - wizard-network

networks:
  wizard-network:
    driver: bridge
