services:
  backend:
    build:
      context: ./services/backend
      args:
        FRONTEND_URL: ${FRONTEND_URL}
    environment:
      - FRONTEND_URL=${FRONTEND_URL}
      - NODE_ENV=${NODE_ENV}
      - DATABASE_PATH=/app/data/wizard.db
    volumes:
      - ./data:/app/data
    ports:
      - "8010:3000"
    restart: unless-stopped

  frontend:
    build:
      context: ./services/frontend-vite
      args:
        VITE_BACKEND_URL: ${BACKEND_URL}
    environment:
      - VITE_BACKEND_URL=${BACKEND_URL}
      - NODE_ENV=${NODE_ENV}
    ports:
      - "8011:3000"
    depends_on:
      - backend
    restart: unless-stopped
